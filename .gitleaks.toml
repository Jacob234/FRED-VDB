# gitleaks configuration for FRED-VDB.
# Extends the upstream default rule set with a FRED-specific detector,
# and allowlists known false-positive paths plus the historical leaked
# (and rotated) key string so old commits don't block fresh ones.
[extend]
useDefault = true

[[rules]]
id = "fred-api-key"
description = "FRED API key (32-char lowercase hex assigned to FRED_API_KEY)"
regex = '''(?i)fred[_-]?api[_-]?key["'\s:=]+([a-f0-9]{32})\b'''
keywords = ["fred_api_key", "FRED_API_KEY"]

[allowlist]
description = "Known false-positive paths and historical leak commit"
paths = [
  '''uv\.lock''',
  '''\.gitignore''',
  '''\.gitleaks\.toml''',
]
# The commit below leaked a FRED API key into .planning/codebase/CONCERNS.md.
# The key has been rotated; allowlisting the commit (not the literal value)
# keeps `gitleaks detect` history scans clean without re-inlining the dead
# value into HEAD.
commits = [
  "2eed6b5509c62042c769b71f0bd7ba073a982d8a",
]
